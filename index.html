<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Dump</title>

<style>
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
    overflow-x: hidden;
    color: #333;
}

section {
    padding: 80px 20px;
    text-align: center;
    position: relative;
    z-index: 1;
}

h1, h2 { margin-bottom: 20px; }

.romantic-text {
    max-width: 700px;
    margin: auto;
    font-size: 16px;
    line-height: 1.8;
    background: rgba(255,255,255,0.7);
    padding: 25px;
    border-radius: 20px;
}

/* Tombol Musik */
.music-btn {
    padding: 12px 25px;
    background: #ff4d6d;
    color: white;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 15px;
    margin-top: 20px;
}

/* Gallery Mobile Premium */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
}

@media(min-width: 768px){
    .gallery {
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }
}

.gallery img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 18px;
    cursor: pointer;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

/* Lightbox */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: 0.3s;
    z-index: 9999;
}

.lightbox.active {
    opacity: 1;
    visibility: visible;
}

.lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 15px;
}

.close-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 35px;
    color: white;
    cursor: pointer;
}

/* Efek Hati */
.heart {
    position: fixed;
    top: -10px;
    font-size: 20px;
    pointer-events: none;
    z-index: 0;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<section>
    <h1>Roblox Nih Bos</h1>
    <div class="romantic-text">
        Roblox Number 1
    </div>

    <button class="music-btn" onclick="toggleMusic()" id="musicButton">
        ▶️ Putar Musik
    </button>
</section>

<section>
    <h2>Galery Roblox📸</h2>
    <div class="gallery" id="gallery"></div>
</section>

<audio id="bgMusic" loop>
    <source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="lightbox" id="lightbox">
    <span class="close-btn" onclick="closeLightbox()">✖</span>
    <img id="lightbox-img">
</div>

<script>
const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

/* AUTO GENERATE FOTO1 - FOTO20 */
for(let i = 1; i <= 20; i++){
    const img = document.createElement("img");
    img.src = "foto/foto" + i + ".jpg";
    img.onclick = () => openLightbox(img.src);
    gallery.appendChild(img);
}

function openLightbox(src){
    lightboxImg.src = src;
    lightbox.classList.add("active");
}

function closeLightbox(){
    lightbox.classList.remove("active");
}

const music = document.getElementById("bgMusic");
const button = document.getElementById("musicButton");

function toggleMusic(){
    if(music.paused){
        music.play();
        button.innerHTML = "⏸ Pause Musik";
    } else {
        music.pause();
        button.innerHTML = "▶️ Putar Musik";
    }
}

/* Efek Hati */
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = ["💖","💗","💘","❤️"][Math.floor(Math.random()*4)];
    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (3+Math.random()*3)+"s";
    heart.style.fontSize = (15+Math.random()*20)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}

setInterval(createHeart,300);
</script>

</body>
</html>
