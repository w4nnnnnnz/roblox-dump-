<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu 💕</title>

<style>
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
    overflow-x: hidden;
    color: #333;
}

/* ===== SECTION ===== */
section {
    padding: 80px 20px;
    text-align: center;
}

.romantic-text {
    max-width: 700px;
    margin: auto;
    font-size: 16px;
    line-height: 1.8;
    background: rgba(255,255,255,0.7);
    padding: 25px;
    border-radius: 20px;
}

/* ===== MUSIC BUTTON ===== */
.music-btn {
    padding: 12px 25px;
    background: #ff4d6d;
    color: white;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 15px;
    margin-top: 20px;
}

/* ===== GALLERY ===== */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

@media(min-width:768px){
    .gallery { grid-template-columns: repeat(4,1fr); }
}

.gallery img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 18px;
    cursor: pointer;
    transition: .3s;
}

.gallery img:hover { transform: scale(1.05); }

/* ===== LIGHTBOX ===== */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(12px);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: .4s ease;
    z-index: 9999;
}

.lightbox.active {
    opacity: 1;
    visibility: visible;
}

/* Container */
.slider-container {
    display: flex;
    align-items: center;
    gap: 20px;
    transition: transform .6s cubic-bezier(.22,.61,.36,1);
    animation: zoomIn .5s ease;
}

/* Images */
.slider-container img {
    border-radius: 20px;
    cursor: pointer;
    transition: .5s cubic-bezier(.22,.61,.36,1);
}

/* Center image */
.slider-container img.active {
    width: 300px;
    transform: scale(1);
    opacity: 1;
    z-index: 2;
}

/* Side preview */
.slider-container img.side {
    width: 180px;
    opacity: .6;
    transform: scale(.85);
}

/* Zoom animation */
@keyframes zoomIn {
    from { transform: scale(.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* Close */
.close-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 35px;
    color: white;
    cursor: pointer;
}

/* Hearts */
.heart {
    position: fixed;
    top: -10px;
    font-size: 20px;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<section>
<h1>Untuk Kamu 💕</h1>
<div class="romantic-text">
Semua foto ini adalah cerita tentang kita.
Dan aku ingin terus membuat cerita baru bersamamu.
</div>
<button class="music-btn" onclick="toggleMusic()" id="musicButton">
▶️ Putar Musik
</button>
</section>

<section>
<h2>Kenangan Kita 📸</h2>
<div class="gallery" id="gallery"></div>
</section>

<audio id="bgMusic" loop>
<source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="lightbox" id="lightbox">
<span class="close-btn" onclick="closeLightbox()">✖</span>
<div class="slider-container" id="slider"></div>
</div>

<script>
const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const slider = document.getElementById("slider");

let currentIndex = 0;
const totalImages = 20;

/* Generate Gallery */
for(let i=1;i<=totalImages;i++){
    const img=document.createElement("img");
    img.src="foto/foto"+i+".jpg";
    img.loading="lazy";
    img.onclick=()=>openLightbox(i-1);
    gallery.appendChild(img);
}

function openLightbox(index){
    currentIndex=index;
    updateSlider();
    lightbox.classList.add("active");
}

function closeLightbox(){
    lightbox.classList.remove("active");
}

function updateSlider(){
    slider.innerHTML="";

    const prev=(currentIndex-1+totalImages)%totalImages;
    const next=(currentIndex+1)%totalImages;

    const prevImg=createImg(prev,"side");
    const mainImg=createImg(currentIndex,"active");
    const nextImg=createImg(next,"side");

    slider.appendChild(prevImg);
    slider.appendChild(mainImg);
    slider.appendChild(nextImg);
}

function createImg(index,type){
    const img=document.createElement("img");
    img.src="foto/foto"+(index+1)+".jpg";
    img.classList.add(type);

    img.onclick=()=>{
        if(type==="side"){
            currentIndex=index;
            slider.style.transform="translateX(50px)";
            setTimeout(()=>{
                slider.style.transform="translateX(0)";
                updateSlider();
            },150);
        }
    };
    return img;
}

/* MUSIC */
const music=document.getElementById("bgMusic");
const button=document.getElementById("musicButton");

function toggleMusic(){
    if(music.paused){
        music.play();
        button.innerHTML="⏸ Pause Musik";
    }else{
        music.pause();
        button.innerHTML="▶️ Putar Musik";
    }
}

/* Hearts */
function createHeart(){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML=["💖","💗","💘","❤️"][Math.floor(Math.random()*4)];
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(4+Math.random()*2)+"s";
    heart.style.fontSize=(15+Math.random()*20)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,900);
</script>

</body>
</html>
