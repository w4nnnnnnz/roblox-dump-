<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu 💕</title>

<style>
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
    overflow-x: hidden;
    color: #333;
}

section {
    padding: 80px 20px;
    text-align: center;
    position: relative;
    z-index: 1;
}

.romantic-text {
    max-width: 700px;
    margin: auto;
    font-size: 16px;
    line-height: 1.8;
    background: rgba(255,255,255,0.7);
    padding: 25px;
    border-radius: 20px;
}

/* Tombol Musik */
.music-btn {
    padding: 12px 25px;
    background: #ff4d6d;
    color: white;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 15px;
    margin-top: 20px;
}

/* Gallery */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
}

@media(min-width: 768px){
    .gallery {
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }
}

.gallery img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 18px;
    cursor: pointer;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

/* LIGHTBOX */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: 0.3s;
    z-index: 9999;
}

.lightbox.active {
    opacity: 1;
    visibility: visible;
}

.lightbox img {
    max-width: 90%;
    max-height: 85%;
    border-radius: 15px;
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(.4,0,.2,1), opacity 0.5s;
}

/* Close */
.close-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 35px;
    color: white;
    cursor: pointer;
}

/* Arrow */
.arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    color: white;
    cursor: pointer;
    padding: 10px;
    user-select: none;
}

.arrow.left { left: 20px; }
.arrow.right { right: 20px; }

/* Hati */
.heart {
    position: fixed;
    top: -10px;
    font-size: 20px;
    pointer-events: none;
    z-index: 0;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<section>
<h1>Untuk Kamu 💕</h1>
<div class="romantic-text">
Semua foto di halaman ini adalah cerita tentang kita.
Setiap momen yang tertangkap kamera,
adalah bagian kecil dari kenangan besar
yang selalu ingin ku jaga.
</div>

<button class="music-btn" onclick="toggleMusic()" id="musicButton">
▶️ Putar Musik
</button>
</section>

<section>
<h2>Kenangan Kita 📸</h2>
<div class="gallery" id="gallery"></div>
</section>

<audio id="bgMusic" loop>
<source src="musik.mp3" type="audio/mpeg">
</audio>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
<span class="close-btn" onclick="closeLightbox()">✖</span>
<span class="arrow left" onclick="prevImage()">❮</span>
<img id="lightbox-img">
<span class="arrow right" onclick="nextImage()">❯</span>
</div>

<script>
const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

let currentIndex = 0;
const totalImages = 24;
let startX = 0;

/* Generate Foto */
for(let i = 1; i <= totalImages; i++){
    const img = document.createElement("img");
    img.src = "foto/foto" + i + ".jpg";
    img.loading = "lazy";
    img.onclick = () => openLightbox(i-1);
    gallery.appendChild(img);
}

function openLightbox(index){
    currentIndex = index;
    updateImage();
    lightbox.classList.add("active");
}

function closeLightbox(){
    lightbox.classList.remove("active");
}

function updateImage(){
    lightboxImg.src = "foto/foto" + (currentIndex+1) + ".jpg";
}

/* ANIMASI SLIDE */
function animateSlide(direction){
    lightboxImg.style.opacity = 0;
    lightboxImg.style.transform = direction === "next" 
        ? "translateX(-40px)" 
        : "translateX(40px)";

    setTimeout(() => {
        if(direction === "next"){
            currentIndex = (currentIndex + 1) % totalImages;
        } else {
            currentIndex = (currentIndex - 1 + totalImages) % totalImages;
        }

        updateImage();

        lightboxImg.style.transform = direction === "next" 
            ? "translateX(40px)" 
            : "translateX(-40px)";

        setTimeout(() => {
            lightboxImg.style.opacity = 1;
            lightboxImg.style.transform = "translateX(0)";
        }, 50);

    }, 200);
}

function nextImage(){
    animateSlide("next");
}

function prevImage(){
    animateSlide("prev");
}

/* Klik gambar = next */
lightboxImg.onclick = nextImage;

/* Swipe Support */
lightboxImg.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
});

lightboxImg.addEventListener("touchend", e=>{
    let endX = e.changedTouches[0].clientX;
    if(startX - endX > 50){
        nextImage();
    } else if(endX - startX > 50){
        prevImage();
    }
});

/* MUSIC */
const music = document.getElementById("bgMusic");
const button = document.getElementById("musicButton");

function toggleMusic(){
    if(music.paused){
        music.play();
        button.innerHTML = "⏸ Pause Musik";
    } else {
        music.pause();
        button.innerHTML = "▶️ Putar Musik";
    }
}

/* Efek Hati (lebih ringan) */
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = ["💖","💗","💘","❤️"][Math.floor(Math.random()*4)];
    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (4+Math.random()*2)+"s";
    heart.style.fontSize = (15+Math.random()*20)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}

setInterval(createHeart,2000);
</script>

</body>
</html>
